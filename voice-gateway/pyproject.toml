[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hermes-voice-gateway"
version = "0.1.0"
description = "Full-duplex Qwen Audio realtime voice shell for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rothss" }]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=14,<16",
  "pydantic-settings>=2.6,<3",
  "pyaudio>=0.2.14,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
hermes-voice = "hermes_voice_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_voice_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
